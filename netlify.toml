# Hosting (BLTH-4/34). Supabase-Werte als Umgebungsvariablen in Netlify setzen:
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_VAPID_PUBLIC_KEY (öffentliche Werte, siehe .env.example)
[build]
  command = "npm run build"
  publish = "dist"
  # Jeder Produktions-Deploy kostet Credits (Gratis-Plan: 300 im Monat, 15 je Deploy).
  # Gebaut wird nur, wenn sich etwas ändert, das in die App einfliesst. Reine Doku (*.md),
  # Edge Functions/Migrationen (supabase/, per CLI deployt) und scripts/ lösen keinen Deploy aus.
  # Exit 0 = überspringen, 1 = bauen; fehlt der Vergleichsstand (128), wird gebaut.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Service Worker nie aus dem Cache: sonst bleiben Push und App-Updates hängen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Einzelseiten-App: alle Pfade auf index.html (Links wie /?open=news:… aus Mitteilungen)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
